---
layout: blog
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</div>
  {{ content }}
</article>
<div class="back"><a href="{{ '/blog/' | relative_url }}">← all posts</a></div>
