<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}Mustafa's blog</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="alternate" type="application/atom+xml" title="Mustafa's blog" href="{{ '/blog/feed.xml' | relative_url }}">
</head>
<body>
{% assign s = '/assets/blog/sprites/' | relative_url %}
<!-- sky: drifting clouds and a bird (decorative) -->
<div class="sky" aria-hidden="true">
  <img class="cloud c1" src="{{ s }}cloud.svg" alt="">
  <img class="cloud c2" src="{{ s }}cloud.svg" alt="">
  <img class="cloud c3" src="{{ s }}cloud.svg" alt="">
  <img class="bird" src="{{ s }}bird.svg" alt="">
</div>
<header class="bhead">
  <div class="wrap">
    <img src="{{ '/assets/me.jpg' | relative_url }}" alt="">
    <a class="name" href="{{ '/' | relative_url }}">Mustafa Mohammed Ali</a>
    <nav>
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/blog/' | relative_url }}">blog</a>
      <a href="{{ '/blog/feed.xml' | relative_url }}">rss</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<!-- ground: a little pixel world at the bottom of the page (decorative) -->
<footer class="scene" aria-hidden="true">
  <img class="tree t1" src="{{ s }}tree.svg" alt="">
  <img class="bush b1" src="{{ s }}bush.svg" alt="">
  <img class="bunny" src="{{ s }}bunny.svg" alt="">
  <img class="flower f1" src="{{ s }}flower.svg" alt="">
  <img class="rock r1" src="{{ s }}rock.svg" alt="">
  <img class="slime" src="{{ s }}slime.svg" alt="">
  <img class="flower f2" src="{{ s }}flower.svg" alt="">
  <img class="bush b2" src="{{ s }}bush.svg" alt="">
  <img class="tree t2" src="{{ s }}tree.svg" alt="">
  <img class="rock r2" src="{{ s }}rock.svg" alt="">
  <div class="ground"></div>
</footer>
</body>
</html>
